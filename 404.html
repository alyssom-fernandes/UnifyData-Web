<!DOCTYPE html>
<html lang="pt-BR" data-tema="escuro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · UnifyData</title>
<meta name="color-scheme" content="dark light">
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="/UnifyData-Web/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@85..100,400..700&family=JetBrains+Mono:wght@700&display=swap">
<!-- Página própria para endereço que não existe (o GitHub Pages usa o 404.html
     da raiz). Segue o tema escolhido no UnifyData e, sem escolha, o do aparelho. -->
<script>
  (function () {
    var t = null;
    try { t = localStorage.getItem('unifydata_tema'); } catch (e) {}
    if (t !== 'claro' && t !== 'escuro') t = window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'claro' : 'escuro';
    document.documentElement.setAttribute('data-tema', t);
  })();
</script>
<style>
  :root { --fundo: #141416; --borda: #2a2a30; --texto: #ededef; --fraco: #a9a9b3; --apagado: #8a8a94; --tinta: #ededef; --sobre-tinta: #141416;
          --acento: #3fcfb9; --borda-campo: #6b6b75; --sup: #1a1a1d; --pf-afn: #c44a5a; --pf-sys: rgba(255,255,255,.32); color-scheme: dark; }
  [data-tema="claro"] { --fundo: #f6f6f7; --borda: #e5e5e9; --texto: #18181b; --fraco: #52525b; --apagado: #6b6b75; --tinta: #18181b; --sobre-tinta: #fff;
          --acento: #0d6e66; --borda-campo: #8e8e99; --sup: #fff; --pf-afn: #6b1f2a; --pf-sys: #505050; color-scheme: light; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; display: flex; flex-direction: column; background: var(--fundo); color: var(--texto);
         font-family: 'Instrument Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  .logo { display: flex; align-items: center; gap: 10px; padding: 28px clamp(24px, 6vw, 88px) 0; font-size: 16px; font-weight: 650; }
  .logo svg { width: 26px; height: 26px; }
  .a, .b { fill: none; stroke-width: 2.6; } .a { stroke: var(--fraco); } .b { stroke: var(--acento); } .c { fill: var(--acento); }
  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 48px clamp(24px, 6vw, 88px); max-width: 760px; }
  .codigo { font: 700 10.5px/1 'JetBrains Mono', monospace; letter-spacing: 1.4px; text-transform: uppercase; color: var(--apagado); margin-bottom: 18px; }
  h1 { font-size: clamp(34px, 7vw, 52px); font-weight: 650; font-stretch: 92%; letter-spacing: -.03em; line-height: 1.04; margin-bottom: 16px; text-wrap: balance; }
  h1 span { display: block; color: var(--apagado); text-wrap: balance; }
  p { font-size: 17px; line-height: 1.6; color: var(--fraco); margin-bottom: 32px; }
  .acoes { display: flex; flex-wrap: wrap; gap: 10px; }
  a.btn { display: inline-flex; align-items: center; height: 44px; padding: 0 18px; border-radius: 10px; font-size: 15px; font-weight: 600; text-decoration: none; }
  .pri { background: var(--tinta); color: var(--sobre-tinta); }
  .sec { border: 1px solid var(--borda-campo); background: var(--sup); color: var(--texto); }
  a:focus-visible { outline: 2px solid var(--acento); outline-offset: 2px; }
  footer { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 20px; border-top: 1px solid var(--borda);
           font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .pf-afn { font-size: 10px; letter-spacing: 2px; color: var(--pf-afn); }
  .pf-sys { font-size: 10px; letter-spacing: 2px; color: var(--pf-sys); margin-left: 4px; }
  .pf-pipe { font-size: 13px; color: var(--pf-sys); }
  .pf-info { font-size: 11px; letter-spacing: .3px; color: var(--pf-sys); }
</style>
</head>
<body>
  <div class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect class="a" x="4.2" y="4.2" width="15.6" height="15.6" rx="4.2"/><rect class="b" x="12.2" y="12.2" width="15.6" height="15.6" rx="4.2"/><path class="c" d="M12.2 16.4a4.2 4.2 0 0 1 4.2-4.2h3.4v3.4a4.2 4.2 0 0 1-4.2 4.2h-3.4z"/></svg>UnifyData</div>
  <main>
    <p class="codigo">Erro 404</p>
    <h1>Esta página não existe. <span>O fechamento continua lá.</span></h1>
    <p>O endereço pode ter mudado ou ter sido digitado errado.</p>
    <div class="acoes">
      <a class="btn pri" href="/UnifyData-Web/">Abrir o UnifyData</a>
      <a class="btn sec" href="/UnifyData-Web/?demo=1">Ver a demonstração</a>
    </div>
  </main>
  <footer aria-label="AFN Systems, UnifyData">
    <span><span class="pf-afn">AFN</span><span class="pf-sys">SYSTEMS</span></span>
    <span class="pf-pipe" aria-hidden="true">|</span>
    <span class="pf-info">UnifyData</span>
  </footer>
</body>
</html>
